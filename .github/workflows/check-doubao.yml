name: Check Doubao IME Windows

on:
  schedule:
    # 03:00/09:00/15:00/21:00 UTC = 11:00/17:00/23:00/05:00 Beijing.
    # This finishes before the existing ChatGPT six-hour monitoring checks.
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-doubao.yml'
      - 'scripts/check-doubao.mjs'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: doubao-windows-verify
  cancel-in-progress: false

jobs:
  windows-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free open-source Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Verify official Windows card and actual EXE filename
        run: npm run check:doubao
      - name: Store completed verified Windows results only
        if: success()
        run: |
          if [[ -n "$(git status --short status/doubao-windows.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/doubao-windows.json
            git commit -m "Store verified Doubao Windows browser results [skip ci]"
            git push
          else
            echo "No status file changes."
          fi
      - name: Upload evidence and troubleshooting logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doubao-windows-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
