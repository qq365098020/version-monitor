 solid #69a7ff;border-radius:10px;padding:10px 15px;font-size:13px}.versionbar span{font-size:12px;color:#92a7c0}.calculate{width:100%;margin-top:18px;padding:14px;border:1px solid #80bfff;border-radius:12px;background:linear-gradient(135deg,#367cca,#31567d);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;box-shadow:0 4px 15px #0004}.calculate:active{transform:scale(.97);filter:brightness(1.2)}body{background:#08101e;background-image:radial-gradient(ellipse at 12% 12%,#315274a8,transparent 46%),radial-gradient(ellipse at 92% 35%,#413b6b88,transparent 44%),linear-gradient(155deg,#101c30,#090e1a 80%);background-attachment:fixed;min-height:100vh;touch-action:pan-x pan-y}header{padding-top:calc(20px + env(safe-area-inset-top));}h1{letter-spacing:.02em;color:#f6f9ff;text-shadow:0 2px 16px #9dc6ff55}.tabs{gap:4px;padding:4px;border:1px solid #ffffff30;border-radius:16px;background:#c5dcff18;box-shadow:inset 0 1px #ffffff28,0 8px 24px #0003;-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}.tabs button{border:1px solid transparent;background:transparent;border-radius:12px;color:#cbd9ea;font-weight:600}.tabs .active{background:linear-gradient(160deg,#c8e2ff70,#739ac346);border-color:#ffffff55;color:#fff;box-shadow:inset 0 1px #ffffff62,0 3px 12px #0004}.panel{background:linear-gradient(145deg,#cbdfff25,#9db8d30c);border:1px solid #ffffff36;border-radius:24px;box-shadow:inset 0 1px #ffffff40,0 16px 40px #0005;-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);padding:19px}label{color:#c9d8eb}input{font-size:18px;background:#0814258c;border:1px solid #ffffff2b;border-radius:13px;box-shadow:inset 0 1px 5px #0005}input:focus{border-color:#9dcfff;box-shadow:0 0 0 3px #83c2ff28}.big{color:#9aefd2;text-shadow:0 2px 22px #5adab859}.metric{border-color:#ffffff1c}.tip,.page-title,.hint,footer{color:#c0cede}.calculate,.versionbar button{background:linear-gradient(135deg,#9ecfff77,#719adf50);border:1px solid #d2eaff8c;box-shadow:inset 0 1px #fff7,0 8px 20px #0004;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}.calculate{border-radius:15px}.versionbar button{border-radius:13px}.warning{color:#ffdb9e}.page{padding-bottom:calc(40px + env(safe-area-inset-bottom))}.tabs{position:relative;isolation:isolate}.tab-indicator{position:absolute;z-index:0;left:4px;top:4px;bottom:4px;width:calc((100% - 12px)/2);border-radius:12px;background:linear-gradient(160deg,#c8e2ff70,#739ac346);border:1px solid #ffffff55;box-shadow:inset 0 1px #ffffff62,0 3px 12px #0004;pointer-events:none;will-change:transform}.tabs button,.tabs .active{position:relative;z-index:1;background:transparent;border-color:transparent;box-shadow:none}.tabs .active{color:#fff}body{background-image:radial-gradient(ellipse at 12% 8%,#567fa4b5,transparent 48%),radial-gradient(ellipse at 91% 32%,#6b5f97a0,transparent 46%),radial-gradient(ellipse at 42% 77%,#335c7590,transparent 54%),linear-gradient(155deg,#1a2c45,#10182a 82%)}.panel{background:linear-gradient(145deg,#e6f1ff38 0%,#afcbe728 45%,#91a9cf19 100%);border-color:#e4f4ff54;box-shadow:inset 0 1px 1px #ffffff78,inset 1px 0 #ffffff1f,0 18px 44px #0005,0 1px 10px #88c3fa16;-webkit-backdrop-filter:blur(28px) saturate(165%);backdrop-filter:blur(28px) saturate(165%)}.tabs{background:#c8ddf024;border-color:#e4f4ff42;box-shadow:inset 0 1px #ffffff50,0 8px 24px #0003}.tab-indicator{background:linear-gradient(155deg,#edf8ff9c,#a8cef465 52%,#829fc249);border-color:#ffffff82;box-shadow:inset 0 1px 1px #fff9,0 4px 15px #0004}input{background:#0c1a2aa6;border-color:#ffffff3d;box-shadow:inset 0 1px 4px #0005,0 1px #ffffff18}.calculate,.versionbar button{background:linear-gradient(150deg,#d6ecffa1,#a4cbf078 48%,#7097d45c);border-color:#e4f6ffb3;box-shadow:inset 0 1px 2px #ffffffb3,0 8px 22px #0004;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}.calculate:active,.versionbar button:active{transform:scale(.97);filter:brightness(1.15);box-shadow:inset 0 2px 8px #ffffff50,0 3px 10px #0003}.tabs button{transition:color .16s ease,transform .16s ease}.tabs button:active{transform:scale(.97)}@media(prefers-reduced-motion:reduce){.calculate,.versionbar button,.tabs button{transition:none}}</style><header><h1>仓位计算器</h1><div class="tabs"><span class="tab-indicator" aria-hidden="true"></span><button class="active" data-page="0">手机</button><button data-page="1">电脑</button></div><div class="tip">左右滑动切换 · 两页数据分别记忆</div></header><div class="viewport" id="viewport"><div class="track" id="track"></div></div><script>document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});const track=document.getElementById('track'),viewport=document.getElementById('viewport');const defaults={equity:'3.2',risk:'13.5',pnlNow:'0',pnlStop:'',entry:'',stop:'',leverage:'20'},states=[{...defaults},{...defaults}];try{for(const k of ['equity','risk','leverage']){const v=localStorage.getItem('position_calc_'+k);if(v!==null&&/^-?\d*(?:\.\d*)?$/.test(v))states[0][k]=v}for(const k of ['equity','risk','leverage','entry','stop']){const v=localStorage.getItem('position_calc_computer_'+k);if(v!==null&&/^-?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(v))states[1][k]=v}}catch(e){}let state=states[0];const field=(key,label)=>'<div><label>'+label+'</label><input data-key="'+key+'" type="number" inputmode="decimal" step="any" value="'+state[key]+'"></div>';const results=()=>'<section class="panel"><div class="hint">按风险计算的名义仓位</div><div class="big" data-out="notional">—</div>'+[['feasible','余额可开名义仓位'],['loss','可开仓位预计止损亏损'],['effective','价格波动距离（%）'],['margin','占用保证金'],['multiple','仓位/余额']].map(([k,l])=>'<div class="metric"><span>'+l+'</span><b data-out="'+k+'">—</b></div>').join('')+'<p class="warning" data-out="message"></p></section><footer>仅供仓位规划；实际成交可能受滑点、手续费及交易所规则影响。</footer><div class="versionbar"><button type="button" onclick="refreshLatest()">检查更新 / 刷新</button><span>v1.5.1</span></div>';function page(m){state=states[m];return '<section class="page"><div class="content"><div class="page-title">'+(m===0?'输入价格涨跌百分比（相同基准）':'输入入场价和止损价')+'</div><section class="panel"><div class="row">'+field('equity','余额（U）')+field('risk','风险比例（%）')+'</div>'+(m===0?'<div class="row">'+field('pnlNow','初始涨跌（%）')+field('pnlStop','止损涨跌（%）')+'</div>':'<div class="row">'+field('entry','入场价格')+field('stop','止损价格')+'</div>')+'<div class="row">'+field('leverage','杠杆倍数')+'</div><button class="calculate" type="button">计算仓位</button>'+'</section>'+results()+'</div></section>'}track.innerHTML=page(0)+page(1);state=states[0];let active=0,calculated=false;const num=k=>Number(state[k]),fmt=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—',fmtDistance=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:6}):'—';function recalc(){let e=num('equity'),r=num('risk'),lev=num('leverage'),d=active===0?(state.pnlNow.trim()!==''&&state.pnlStop.trim()!==''&&lev>0?Math.abs(num('pnlNow')-num('pnlStop')):NaN):(num('entry')>0&&num('stop')>0?Math.abs(num('entry')-num('stop'))/num('entry')*100:NaN),ok=calculated&&e>0&&r>0&&r<=100&&d>0&&lev>=1,budget=e*r/100,eff=d,theory=ok?budget/(eff/100):NaN,n=ok?Math.min(theory,e*lev):NaN,loss=n*eff/100,margin=n/lev,out={notional:ok?fmt(theory)+' U':'—',feasible:ok?fmt(n)+' U':'—',loss:ok?fmt(loss)+' U':'—',effective:ok?fmtDistance(eff)+'%':'—',margin:ok?fmt(margin)+' U':'—',multiple:ok?fmt(n/e)+' 倍':'—',message:!calculated?'请输入数据后点击计算':!ok?'请检查输入数值':theory>e*lev?'⚠️ 余额不足：可开仓位已按余额估算':r>=10?'⚠️ 风险比例较高':''};for(const [k,v] of Object.entries(out))document.querySelectorAll('[data-out="'+k+'"]').forEach(el=>el.textContent=v)}track.addEventListener('input',ev=>{let k=ev.target.dataset.key;if(!k)return;const pageIndex=Array.from(track.children).indexOf(ev.target.closest('.page'));state=states[pageIndex];active=pageIndex;state[k]=ev.target.value;const saveKeys=pageIndex===0?['equity','risk','leverage']:['equity','risk','leverage','entry','stop'];if(saveKeys.includes(k)){try{localStorage.setItem((pageIndex===0?'position_calc_':'position_calc_computer_')+k,state[k])}catch(e){}}calculated=false;recalc()});track.addEventListener('click',ev=>{if(ev.target.closest('.calculate')){active=Array.from(track.children).indexOf(ev.target.closest('.page'));state=states[active];calculated=true;recalc()}});function switchTo(i){active=i;state=states[i];calculated=false;viewport.scrollTo({left:i*viewport.clientWidth,behavior:'smooth'});document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));recalc()}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTo(Number(b.dataset.page))));const tabs=document.querySelector('.tabs'),indicator=document.querySelector('.tab-indicator');function updateIndicator(){const p=Math.max(0,Math.min(1,viewport.scrollLeft/viewport.clientWidth));indicator.style.transform='translateX('+(p*(tabs.clientWidth-8+4)/2)+'px)'}updateIndicator();window.addEventListener('resize',updateIndicator);let t;viewport.addEventListener('scroll',()=>{updateIndicator();clearTimeout(t);t=setTimeout(()=>{let i=Math.round(viewport.scrollLeft/viewport.clientWidth);if(i!==active){active=i;state=states[i];calculated=false;document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));recalc()}},90)});function refreshLatest(){const u=new URL(location.href);u.searchParams.set('v',Date.now().toString());location.replace(u.toString())}recalc();</script></html>
