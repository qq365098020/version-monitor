<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><title>仓位计算器</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f6fc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:520px;margin:auto;padding:20px 14px 0}h1{font-size:23px;margin:0}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;background:#172235;border:1px solid #34445d;color:#b7c7da;border-radius:10px;padding:12px 4px;font-size:14px}.tabs .active{background:#31567d;border-color:#69a7ff;color:white}.tip{font-size:12px;color:#92a7c0;text-align:center;margin:10px}.viewport{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.viewport::-webkit-scrollbar{display:none}.track{display:flex;width:200%}.page{flex:0 0 50%;width:50%;scroll-snap-align:start;padding:0 12px 40px}.content{max-width:496px;margin:auto}.panel{background:#172235;border:1px solid #27374f;border-radius:17px;padding:16px;margin-top:14px}label{display:block;font-size:13px;color:#b7c7da;margin:14px 0 7px}input{width:100%;background:#0d1829;border:1px solid #34445d;border-radius:10px;padding:12px 9px;color:white;font-size:18px;outline:none}input:focus{border-color:#69a7ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.big{font-size:34px;font-weight:750;color:#73e0b3;margin:7px 0}.metric{display:flex;justify-content:space-between;border-top:1px solid #2b3c53;padding:12px 0;font-size:13px;gap:10px}.metric b{font-size:15px}.hint,footer{font-size:12px;color:#9baac0}.warning{color:#ffd089;font-size:13px;min-height:16px}.page-title{font-size:13px;color:#b7c7da;margin:12px 2px 0} .versionbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 0}.versionbar button{background:#31567d;color:white;border:1px solid #69a7ff;border-radius:10px;padding:10px 15px;font-size:13px}.versionbar span{font-size:12px;color:#92a7c0}</style><header><h1>仓位计算器</h1><div class="tabs"><button class="active" data-page="0">手机</button><button data-page="1">电脑</button></div><div class="tip">左右滑动切换 · 参数同步 · 结果保留两位小数</div></header><div class="viewport" id="viewport"><div class="track" id="track"></div></div><script>const track=document.getElementById('track'),viewport=document.getElementById('viewport');const state={equity:'3.2',risk:'13.5',pnlNow:'',pnlStop:'',entry:'',stop:'',leverage:'20',fee:'0.10',slippage:'0.10'};const field=(key,label)=>'<div><label>'+label+'</label><input data-key="'+key+'" type="number" inputmode="decimal" step="any" value="'+state[key]+'"></div>';const results=()=>'<section class="panel"><div class="hint">名义仓位</div><div class="big" data-out="notional">—</div>'+[['loss','最大计划亏损'],['effective','止损距离（含预留）'],['margin','占用保证金'],['multiple','仓位/余额']].map(([k,l])=>'<div class="metric"><span>'+l+'</span><b data-out="'+k+'">—</b></div>').join('')+'<p class="warning" data-out="message"></p></section><footer>仅供仓位规划；实际成交可能受滑点、手续费及交易所规则影响。</footer><div class="versionbar"><button type="button" onclick="refreshLatest()">检查更新 / 刷新</button><span>v1.1.0</span></div>';function page(m){return '<section class="page"><div class="content"><div class="page-title">'+(m===0?'输入当前盈亏%和止损盈亏%':'输入入场价和止损价')+'</div><section class="panel"><div class="row">'+field('equity','余额（U）')+field('risk','风险比例（%）')+'</div>'+(m===0?'<div class="row">'+field('pnlNow','当前盈亏（%）')+field('pnlStop','止损盈亏（%）')+'</div>':'<div class="row">'+field('entry','入场价格')+field('stop','止损价格')+'</div>')+'<div class="row">'+field('leverage','杠杆倍数')+field('fee','手续费预留（%）')+'</div>'+field('slippage','滑点预留（%）')+'</section>'+results()+'</div></section>'}track.innerHTML=page(0)+page(1);let active=0;const num=k=>Number(state[k]),fmt=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';function recalc(){let e=num('equity'),r=num('risk'),lev=num('leverage'),fee=num('fee'),slip=num('slippage'),d=active===0?(state.pnlNow.trim()!==''&&state.pnlStop.trim()!==''&&lev>0?Math.abs(num('pnlNow')-num('pnlStop'))/lev:NaN):(num('entry')>0&&num('stop')>0?Math.abs(num('entry')-num('stop'))/num('entry')*100:NaN),ok=e>0&&r>0&&r<=100&&d>0&&lev>=1&&fee>=0&&slip>=0,loss=e*r/100,eff=d+fee+slip,n=ok?loss/(eff/100):NaN,margin=n/lev,out={notional:ok?fmt(n)+' U':'—',loss:ok?fmt(loss)+' U':'—',effective:ok?fmt(eff)+'%':'—',margin:ok?fmt(margin)+' U':'—',multiple:ok?fmt(n/e)+' 倍':'—',message:!ok?'请检查输入数值':margin>e?'⚠️ 占用金额超过余额':r>=10?'⚠️ 风险比例较高':''};for(const [k,v] of Object.entries(out))document.querySelectorAll('[data-out="'+k+'"]').forEach(el=>el.textContent=v)}track.addEventListener('input',ev=>{let k=ev.target.dataset.key;if(!k)return;state[k]=ev.target.value;document.querySelectorAll('[data-key="'+k+'"]').forEach(el=>{if(el!==ev.target)el.value=state[k]});recalc()});function switchTo(i){active=i;viewport.scrollTo({left:i*viewport.clientWidth,behavior:'smooth'});document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));recalc()}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTo(Number(b.dataset.page))));let t;viewport.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{let i=Math.round(viewport.scrollLeft/viewport.clientWidth);if(i!==active){active=i;document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));recalc()}},90)});async function refreshLatest(){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString());const r=await fetch(u.toString(),{cache:'no-store'});if(!r.ok)throw Error('网络错误');const html=await r.text();if(!html.includes('仓位计算器'))throw Error('页面异常');document.open();document.write(html);document.close();history.replaceState(null,'',location.pathname)}catch(e){alert('刷新失败，请检查网络后重试')}}recalc();</script></html>
